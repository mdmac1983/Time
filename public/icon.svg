<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b3bff"/>
      <stop offset="0.55" stop-color="#8a3dff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2de1c2"/>
      <stop offset="1" stop-color="#b6fff0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- dial -->
  <circle cx="256" cy="286" r="150" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="256" cy="286" r="150" fill="none" stroke="#ffffff" stroke-width="34"/>
  <!-- tick marks -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="160" x2="256" y2="182"/>
    <line x1="382" y1="286" x2="360" y2="286"/>
    <line x1="256" y1="412" x2="256" y2="390"/>
    <line x1="130" y1="286" x2="152" y2="286"/>
  </g>
  <!-- binder rings / alarm bells -->
  <rect x="146" y="62" width="44" height="104" rx="22" fill="#ffffff"/>
  <rect x="322" y="62" width="44" height="104" rx="22" fill="#ffffff"/>
  <!-- check-mark hands -->
  <path d="M188 292 L240 344 L334 236" fill="none" stroke="url(#hand)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="240" cy="344" r="12" fill="#ffffff"/>
</svg>
